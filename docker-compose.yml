services:
  boll-reminder:
    build: .
    container_name: boll-reminder
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      # Optional market-data credentials. Values come from the host shell or a
      # local .env file; config/config.yaml remains the primary persisted config.
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      ALPACA_OPTION_DATA_FEED: ${ALPACA_OPTION_DATA_FEED:-}
      POLYGON_API_KEY: ${POLYGON_API_KEY:-}
    volumes:
      # 挂载配置文件目录（配置文件在服务器上维护，不包含在镜像中）
      - ./config:/app/config
      # 挂载报告输出目录
      - ./report:/app/report
      # 挂载交易同步数据和缓存
      - ./data:/app/data
      # 挂载日志目录
      - ./logs:/app/logs
      # 挂载 Longbridge OAuth token（SDK 自动续期）
      - ./.longbridge_tokens:/root/.longbridge/openapi/tokens
    restart: unless-stopped
    networks:
      - boll-network

networks:
  boll-network:
    driver: bridge
