version: '3.8'

services:
  boll-reminder:
    build: .
    container_name: boll-reminder
    ports:
      - "5000:5000"
    volumes:
      # 挂载配置文件目录（配置文件在服务器上维护，不包含在镜像中）
      - ./config:/app/config
      # 挂载报告输出目录
      - ./report:/app/report
      # 挂载日志目录
      - ./logs:/app/logs
      # 挂载 Longbridge OAuth token（SDK 自动续期）
      - ./.longbridge_tokens:/root/.longbridge/openapi/tokens
    restart: unless-stopped
    networks:
      - boll-network

networks:
  boll-network:
    driver: bridge
